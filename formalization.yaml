version: "v0.4"

project:
  name: "Classical Seifert–van Kampen theorem for the fundamental groupoid"
  description: >-
    Proves that for every topological space X and open cover X = U ∪ V, the
    inclusion-induced square of Mathlib's ordinary continuous-path
    fundamental groupoids for U ∩ V, U, V, and X is a pushout in Cat. The
    statement retains all points as objects and assumes no basepoint,
    connectedness, or separation conditions. The proof uses continuous paths
    and endpoint-preserving homotopies, specializes an auxiliary preorder to
    the indiscrete relation, and proves a natural equivalence with Mathlib's
    ordinary fundamental groupoid. It constructs the categorical descent
    functor by path subdivision and proves homotopy invariance by a square
    subdivision; it does not invoke the imported directed van Kampen theorem.
  authors:
    - "Arthur Freitas Ramos"
  responsible_maintainers:
    - "Arthur Freitas Ramos"
  license: "Apache-2.0"

classification:
  arxiv: ["math.AT", "math.CT", "math.LO"]
  msc2020: ["55Q05", "18B40", "03B35"]

sources:
  - title: "Groupoids and Van Kampen's Theorem"
    authors:
      - "Ronald Brown"
    id: "10.1112/plms/s3-17.3.385"
    type: "article"
    location: "Theorem 3.4 and the full-groupoid case in §5"
    relationship: "formalizes"
    note: >-
      Primary source for the groupoid form of the open-cover theorem. The
      selected statement is the full continuous-path groupoid pushout for a
      two-open cover. This project makes no claim that the mathematical
      theorem is new.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The Directed Van Kampen Theorem in Lean"
    authors:
      - "Henning Basold"
      - "Peter Bruin"
      - "Dominique Lawson"
    id: "10.4230/LIPIcs.ITP.2024.8"
    type: "conference paper and formalization"
    location: "Path-subdivision and homotopy-grid construction for the directed fundamental-category pushout"
    relationship: "adapts"
    note: >-
      The selected proof specializes the universal preorder to identify its
      auxiliary paths and homotopies with ordinary topological ones, reuses
      the source's constructive interval- and square-subdivision lemmas, and
      directly assembles the descent functor and pushout universal property.
      It does not call the imported directed_van_kampen theorem. The helper
      infrastructure is attributed to its authors; the classical theorem is
      known and is not claimed as new here.
    license: "CC-BY-4.0"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/Dominique-Lawson/Directed-Topology-Lean-4/tree/009529606c66d37ef93b4b81b8587f71ce4d2c56"
    relationship: "builds-on"
    note: >-
      The source project is Dominique-Lawson/Directed-Topology-Lean-4 at full
      commit 009529606c66d37ef93b4b81b8587f71ce4d2c56. Its Lean4/ module tree
      is vendored and compatibility-ported into this repository; the exact
      upstream path Lean4/directed_van_kampen.lean contains the
      DirectedVanKampen.PushoutFunctor path-subdivision and homotopy-grid
      lemmas extracted as Lean4/path_descent_helpers.lean and reused here;
      Lean4/vendor-manifest.json records source and port hashes. The upstream
      MIT notice is preserved in Lean4/LICENSE.md.
      The selected proof directly constructs and assembles the descent
      functor; it does not invoke DirectedVanKampen.directed_van_kampen. The
      result also uses the universal-preorder equivalence and naturality
      bridge to Mathlib's ordinary path groupoid.
  - id: "https://github.com/leanprover-community/mathlib4/tree/8f9d9cff6bd728b17a24e163c9402775d9e6a365"
    relationship: "builds-on"
    note: >-
      Exact Mathlib commit pin for the ordinary path fundamental groupoid, induced
      functors, topological subspaces, and categorical pushout API. Challenge
      imports only Mathlib.
  - id: "https://github.com/Arthur742Ramos/ComputationalPathsLean/tree/257c659b7973aeda900d86a5da73b208712c7523"
    relationship: "independent"
    note: >-
      This immutable snapshot contains computational-path based SVK
      equivalences and presentation results. No definitions, source files, or
      proof terms are reused. The result selected here is instead the pushout
      for actual continuous-path groupoids of arbitrary open subsets, with all
      points as objects and without a basepoint or connectedness hypotheses.
  - id: "https://isa-afp.org/entries/Seifert-Van-Kampen.html"
    relationship: "independent"
    note: >-
      Related Isabelle/HOL formalization of a based fundamental-group theorem
      under path-connectedness hypotheses. No Isabelle source or proof is
      reused; the present selected result is an all-object groupoid pushout.

status:
  scope: >-
    An arbitrary topological space X, open subsets U and V with U ∪ V = X,
    and the four continuous-path fundamental groupoids of U ∩ V, U, V, and X.
    No basepoint, path-connectedness, connectedness of the overlap, separation
    axiom, or manifold structure is assumed. The conclusion is the categorical
    pushout property for the maps induced by the four subspace inclusions.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ClassicalSVK.seifert_van_kampen_groupoid"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

