fidelity:
  divergences: >-
    The statement is the full fundamental-groupoid case of the two-open-cover
    theorem: its groupoids contain every point of each space as an object,
    unlike a based fundamental-group statement. Mathlib represents paths on
    the unit interval and endpoint-preserving homotopy; the proof identifies
    these path classes with the directed path classes for the indiscrete
    preorder. The argument explicitly builds on the directed theorem by
    Basold, Bruin, and Lawson. It does not claim a new mathematical theorem,
    reproduce the earlier computational-path proof, or claim an independent
    proof of the directed result.

